# Map of route alias -> real upstream host.
# Copy this file to allowlist.toml (untracked, kept local) and edit there.
# The running process watches allowlist.toml and reloads it automatically
# on change — no restart needed.
#
# Request shape:  http://your-proxy:8080/<alias>/<path...>?<query>
# Forwarded to:   https://<host>/<path...>?<query>

[targets]
kucoin = { host = "api.kucoin.com" }

# Requires a valid HS256 JWT (X-Bouncer-Token: <token>, signed with
# JWT_SECRET) on every request to this alias.
# If ANY target below has auth = true and JWT_SECRET is not set in the environment,
# bouncer refuses to start.

# webhook-a = { host = "internal-a.example.com", auth = true }
# webhook-b = { host = "internal-b.example.com"}
